services:
  migration:
    image: ${ECR_REGISTRY}/outreach-http:${IMAGE_TAG}

    environment:
      DATABASE_URL: ${DATABASE_URL}

    command: bun run db:migrate:deploy

    profiles:
      - migration

  http-server:
    image: ${ECR_REGISTRY}/outreach-http:${IMAGE_TAG}

    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      HTTP_PORT: ${HTTP_PORT:-4000}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      
      NODE_ENV: ${NODE_ENV:-}
      BETTER_STACK_SOURCE_TOKEN: ${BETTER_STACK_SOURCE_TOKEN:-}
      BETTER_STACK_INGESTING_HOST: ${BETTER_STACK_INGESTING_HOST:-}


    ports:
      - "4000:4000"

    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    image: ${ECR_REGISTRY}/outreach-worker:${IMAGE_TAG}

    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-http://localhost:3000}

    depends_on:
      http-server:
        condition: service_healthy

  web:
    image: ${ECR_REGISTRY}/outreach-web:${IMAGE_TAG}

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      APP_NAME: "Cold Out Reach"
      HTTP_SERVER_URL: "http://http-server:4000/api/v1/"

    depends_on:
      http-server:
        condition: service_healthy