version: "3.8"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: coldMailAndOutrech
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  http-server:
    build:
      context: .
      dockerfile: Dockerfile.http
      args:
        DATABASE_URL: postgresql://postgres:mypassword@postgres:5432/coldMailAndOutrech
        HTTP_PORT: 4000
        JWT_ACCESS_SECRET: "eb3a8f02b887b7953a4d4526e439216f6c15127770a2b156f7c96d5e17745130"
        JWT_REFRESH_SECRET: "09484913e34be8eedb7ee2b2b7cf8f1f78d248e3caa1203a68ab8ce3ff5cf82c"
        REDIS_URL: redis://redis:6379

    env_file:
      - .env.docker

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "4000:4000"

    healthcheck:
     test: [ "CMD", "wget", "-qO-", "http://localhost:4000/health" ]
     interval: 30s
     timeout: 5s
     retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        DATABASE_URL: postgresql://postgres:mypassword@postgres:5432/coldMailAndOutrech
        REDIS_URL: redis://redis:6379

    env_file:
      - .env.docker

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_NAME: "Cold Out Reach"
        HTTP_SERVER_URL: "http://http-server:4000/api/v1/"

    env_file:
      - .env.docker

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
