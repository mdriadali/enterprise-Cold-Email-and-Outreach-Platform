services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: coldMailAndOutrech

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coldMailAndOutrech"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # Build the backend image once and run migrations
  migrate:
    build:
      context: .
      dockerfile: ./apps/http-server/Dockerfile.http

    image: enterprise-cold-email-backend:local

    env_file:
      - .env.docker

    command: bun run db:migrate:deploy

    depends_on:
      postgres:
        condition: service_healthy


  http-server:
    image: enterprise-cold-email-backend:local

    env_file:
      - .env.docker

    depends_on:
      migrate:
        condition: service_completed_successfully

    ports:
      - "4000:4000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""
        ]

      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s


  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile.worker

    env_file:
      - .env.docker

    depends_on:
      migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy


  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web

      args:
        APP_NAME: "Cold Out Reach"
        HTTP_SERVER_URL: "http://http-server:4000/api/v1/"

    env_file:
      - .env.docker

    depends_on:
      http-server:
        condition: service_healthy

    ports:
      - "3000:3000"


volumes:
  postgres_data:
  redis_data: