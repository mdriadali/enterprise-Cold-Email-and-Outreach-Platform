name: Development CI

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile


       #only build images for testing
      - name: Build HTTP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/http-server/Dockerfile.http
          push: false

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/worker/Dockerfile.worker
          push: false

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          push: false