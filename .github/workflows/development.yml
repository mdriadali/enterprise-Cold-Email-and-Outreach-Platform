name: Development CI

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --network-concurrency 10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build HTTP Image Test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/http-server/Dockerfile.http
          push: false

      - name: Build Worker Image Test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/worker/Dockerfile.worker
          push: false

      - name: Build Web Image Test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          push: false
          build-args: |
            APP_NAME=Cold Out Reach
            HTTP_SERVER_URL=http://http-server:4000/api/v1/