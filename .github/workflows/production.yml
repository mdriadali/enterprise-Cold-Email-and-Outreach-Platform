name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # BUILD & PUSH IMAGES
  # ============================================================

  build-and-push:
    name: Build ${{ matrix.app.name }} Image

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        app:
          - name: http-server
            dockerfile: ./apps/http-server/Dockerfile.http
            image_name: outreach-http
            build_args: ""

          - name: worker
            dockerfile: ./apps/worker/Dockerfile.worker
            image_name: outreach-worker
            build_args: ""

          - name: web
            dockerfile: ./apps/web/Dockerfile.web
            image_name: outreach-web
            build_args: |
              APP_NAME=Cold Out Reach
              HTTP_SERVER_URL=http://16.170.11.164:4000/api/v1/

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # AWS OIDC
      # ----------------------------------------------------------

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------------------------
      # Login to ECR
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------------------------
      # Build & Push
      # ----------------------------------------------------------

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}

          push: true

          build-args: ${{ matrix.app.build_args }}

          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.app.image_name }}:${{ env.IMAGE_TAG }}

          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}


  # ============================================================
  # DEPLOY TO EC2
  # ============================================================

  deploy-to-ec2:

    name: Deploy to EC2

    needs:
      - build-and-push

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Deployment Configuration
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # AWS OIDC
      # ----------------------------------------------------------

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------------------------
      # Encode Docker Compose
      # ----------------------------------------------------------

      - name: Encode Production Compose
        id: compose
        run: |
          echo "content=$(base64 -w 0 docker-compose.production.yml)" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Create Production Environment
      # ----------------------------------------------------------

      - name: Create Production Environment File
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}

          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

          HTTP_PORT: ${{ secrets.HTTP_PORT }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}

          SMTP_ENCRYPTION: ${{ secrets.SMTP_ENCRYPTION }}

          BETTER_STACK_SOURCE_TOKEN: ${{ secrets.BETTER_STACK_SOURCE_TOKEN }}
          BETTER_STACK_INGESTING_HOST: ${{ secrets.BETTER_STACK_INGESTING_HOST }}

          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_DATASET: ${{ secrets.AXIOM_DATASET }}

          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}

        run: |
          cat > .env.production <<EOF

          ECR_REGISTRY=${ECR_REGISTRY}
          IMAGE_TAG=${IMAGE_TAG}

          DATABASE_URL=${DATABASE_URL}
          DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL}
          REDIS_URL=${REDIS_URL}

          JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}

          HTTP_PORT=${HTTP_PORT:-4000}

          SMTP_HOST=${SMTP_HOST:-}
          SMTP_PORT=${SMTP_PORT:-587}
          SMTP_USER=${SMTP_USER:-}
          SMTP_PASS=${SMTP_PASS:-}

          MAIL_FROM=${MAIL_FROM:-}
          APP_URL=${APP_URL:-}

          SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-none}

          BETTER_STACK_SOURCE_TOKEN=${BETTER_STACK_SOURCE_TOKEN:-}
          BETTER_STACK_INGESTING_HOST=${BETTER_STACK_INGESTING_HOST:-}

          AXIOM_TOKEN=${AXIOM_TOKEN:-}
          AXIOM_DATASET=${AXIOM_DATASET:-}

          LOG_LEVEL=${LOG_LEVEL:-info}

          EOF


      # ----------------------------------------------------------
      # Encode Deployment Script
      # ----------------------------------------------------------

      - name: Encode Deployment Script
        id: deploy-script
        run: |
          echo "content=$(base64 -w 0 scripts/deploy-production.sh)" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Deploy to EC2 via SSM
      # ----------------------------------------------------------

      - name: Deploy to EC2 via SSM
        id: deploy
        env:
          COMPOSE_B64: ${{ steps.compose.outputs.content }}
          DEPLOY_SCRIPT_B64: ${{ steps.deploy-script.outputs.content }}
        run: |
          set -e

          echo "Preparing deployment..."

          ENV_B64=$(base64 -w 0 .env.production)

          echo "Sending deployment command to EC2..."

          # AWS-RunShellScript accepts a list of commands. Keep each entry below
          # the SSM document command limit; encoded scripts and secrets can exceed
          # it when sent as one printf command.
          COMMANDS_FILE=$(mktemp)
          trap 'rm -f "$COMMANDS_FILE"' EXIT

          # The environment snapshot runs before anything else can fail. A full
          # root volume (or a broken SSM agent) makes the agent exit in ~0.1s
          # with no output at all, which is invisible from the runner side, so
          # capture this state on every deploy, success or failure.
          jq -n '{commands: [
            "set -e",
            "echo ========================================",
            "echo Starting SSM deployment bootstrap",
            "echo ========================================",
            "id",
            "date -u",
            "echo --- disk usage ---",
            "df -h 2>&1 || true",
            "echo --- inode usage ---",
            "df -i 2>&1 || true",
            "echo --- memory ---",
            "free -m 2>&1 || true",
            "echo --- docker ---",
            "docker --version 2>&1 || true",
            "docker system df 2>&1 || true",
            "echo --- /opt/outreach ---",
            "ls -la /opt/outreach 2>&1 || true",
            "echo --- ssm agent ---",
            "systemctl is-active amazon-ssm-agent 2>&1 || true",
            "mkdir -p /opt/outreach"
          ]}' > "$COMMANDS_FILE"

          add_ssm_command() {
            local command="$1"
            jq --arg command "$command" '.commands += [$command]' "$COMMANDS_FILE" > "${COMMANDS_FILE}.tmp"
            mv "${COMMANDS_FILE}.tmp" "$COMMANDS_FILE"
          }

          copy_base64_file() {
            local encoded_content="$1"
            local destination="$2"
            local file_mode="${3:-}"
            local encoded_tmp="${destination}.b64.tmp"
            local destination_tmp="${destination}.tmp"
            local chunk

            add_ssm_command ": > '${encoded_tmp}'"

            while IFS= read -r chunk || [ -n "$chunk" ]; do
              add_ssm_command "printf '%s' '${chunk}' >> '${encoded_tmp}'"
            done < <(printf '%s' "$encoded_content" | fold -w 2000)

            add_ssm_command "base64 -d '${encoded_tmp}' > '${destination_tmp}'"
            if [ -n "$file_mode" ]; then
              add_ssm_command "chmod '${file_mode}' '${destination_tmp}'"
            fi
            add_ssm_command "mv '${destination_tmp}' '${destination}'"
            add_ssm_command "rm -f '${encoded_tmp}'"
          }

          copy_base64_file "$COMPOSE_B64" "/opt/outreach/docker-compose.production.yml"
          copy_base64_file "$ENV_B64" "/opt/outreach/.env.production" "600"
          copy_base64_file "$DEPLOY_SCRIPT_B64" "/opt/outreach/deploy.sh" "700"
          add_ssm_command "echo Files copied successfully"
          add_ssm_command "bash /opt/outreach/deploy.sh '${IMAGE_TAG}'"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying version ${IMAGE_TAG}" \
            --parameters "file://${COMMANDS_FILE}" \
            --timeout-seconds 900 \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "Waiting for EC2 deployment..."

          # Must match --timeout-seconds above, otherwise the runner can give up
          # while the deploy is still running on the instance.
          DEPLOYMENT_TIMEOUT_SECONDS=900
          POLL_INTERVAL_SECONDS=5
          deadline=$((SECONDS + DEPLOYMENT_TIMEOUT_SECONDS))

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${AWS_REGION}" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                break
                ;;
            esac

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Deployment did not complete within ${DEPLOYMENT_TIMEOUT_SECONDS} seconds."
              STATUS="TimedOut"
              break
            fi

            echo "Current SSM status: ${STATUS:-Pending}"
            sleep "$POLL_INTERVAL_SECONDS"
          done

          echo "========================================"
          echo "SSM DEPLOYMENT DETAILS"
          echo "========================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${AWS_REGION}" \
            --query '{
              Status:Status,
              StatusDetails:StatusDetails,
              ResponseCode:ResponseCode,
              ExecutionStartDateTime:ExecutionStartDateTime,
              ExecutionElapsedTime:ExecutionElapsedTime
            }' \
            --output table

          echo "========================================"
          echo "STANDARD OUTPUT"
          echo "========================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${AWS_REGION}" \
            --query "StandardOutputContent" \
            --output text

          echo "========================================"
          echo "STANDARD ERROR"
          echo "========================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${AWS_REGION}" \
            --query "StandardErrorContent" \
            --output text

          # The agent puts its own failure message (for example
          # "failed to run commands: exit status 1") in the plugin Output, not in
          # StandardOutputContent/StandardErrorContent. Without this the two
          # sections above are empty and explain nothing.
          echo "========================================"
          echo "SSM PLUGIN OUTPUT (agent-level error message)"
          echo "========================================"

          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --details \
            --region "${AWS_REGION}" \
            --query "CommandInvocations[].CommandPlugins[].Output" \
            --output text || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${AWS_REGION}" \
            --query "Status" \
            --output text)

          echo "========================================"
          echo "FINAL STATUS: $STATUS"
          echo "========================================"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed!"
            echo "If the bootstrap / disk / docker sections above are empty, the"
            echo "SSM agent never executed the script. That is an instance or"
            echo "agent problem (most often a full root volume), not a bug in"
            echo "scripts/deploy-production.sh."
            exit 1
          fi

          echo "Deployment successful!"

      # ----------------------------------------------------------
      # Get Detailed SSM Information
      # ----------------------------------------------------------

      - name: Get SSM Deployment Details
        if: always() && steps.deploy.outputs.command_id != ''
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |

          echo "========== STATUS =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${AWS_REGION}" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,ExecutionStartDateTime:ExecutionStartDateTime,ExecutionElapsedTime:ExecutionElapsedTime}' \
            --output table


          echo "========== STDOUT =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${AWS_REGION}" \
            --query "StandardOutputContent" \
            --output text


          echo "========== STDERR =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${AWS_REGION}" \
            --query "StandardErrorContent" \
            --output text


          echo "========== PLUGIN OUTPUT (agent-level error message) =========="

          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --details \
            --region "${AWS_REGION}" \
            --query "CommandInvocations[].CommandPlugins[].Output" \
            --output text || true


      # ----------------------------------------------------------
      # Failure Diagnostics
      #
      # When the deployment fails, run a minimal, independent command so we can
      # tell two very different situations apart:
      #   1. the instance/agent cannot run anything at all (broken agent, full
      #      disk) - then this self-test fails with no output too;
      #   2. the instance is healthy and only our deploy command failed - then
      #      this self-test succeeds and the environment snapshot is printed.
      # ----------------------------------------------------------

      - name: SSM Failure Diagnostics
        if: failure() && steps.deploy.outputs.command_id != ''
        run: |

          echo "========== SENDING MINIMAL SSM SELF-TEST =========="

          TEST_COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Diagnostics after failed deployment" \
            --timeout-seconds 120 \
            --parameters 'commands=["echo ssm-channel-ok","id","df -h","df -i","docker --version","tail -n 50 /var/log/amazon/ssm/amazon-ssm-agent.log","tail -n 50 /var/log/amazon/ssm/errors.log"]' \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text 2>/dev/null || true)

          if [ -z "$TEST_COMMAND_ID" ]; then
            echo "Could not even send the self-test command - check the runner AWS credentials and ssm:SendCommand permissions."
            exit 0
          fi

          echo "Self-test SSM Command ID: ${TEST_COMMAND_ID}"

          for _ in $(seq 1 12); do
            TEST_STATUS=$(aws ssm get-command-invocation \
              --command-id "$TEST_COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${AWS_REGION}" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "$TEST_STATUS" in
              Success|Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                break
                ;;
            esac

            sleep 5
          done

          echo "Self-test status: ${TEST_STATUS:-Unknown}"

          aws ssm get-command-invocation \
            --command-id "$TEST_COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${AWS_REGION}" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Out:StandardOutputContent,Err:StandardErrorContent}' \
            --output json || true

          echo "========== SELF-TEST PLUGIN OUTPUT =========="

          aws ssm list-command-invocations \
            --command-id "$TEST_COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --details \
            --region "${AWS_REGION}" \
            --query "CommandInvocations[].CommandPlugins[].Output" \
            --output text || true

