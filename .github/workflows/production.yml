name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. GitHub OIDC → AWS IAM Role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build and push HTTP Server
      - name: Build and push HTTP Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/http-server/Dockerfile.http
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/outreach-http:${{ github.sha }}

      # 5. Build and push Worker
      - name: Build and push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/worker/Dockerfile.worker
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/outreach-worker:${{ github.sha }}

      # 6. Build and push Web
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          push: true
          build-args: |
            APP_NAME=Cold Out Reach
            HTTP_SERVER_URL=http://16.170.11.164:4000/api/v1/
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/outreach-web:${{ github.sha }}

      # 7. Encode production compose file
      - name: Encode Docker Compose file
        id: compose
        run: |
          COMPOSE_CONTENT=$(base64 -w 0 docker-compose.production.yml)
          echo "content=$COMPOSE_CONTENT" >> "$GITHUB_OUTPUT"

      # 8. Deploy automatically to EC2 through SSM
      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          SECRET_ID: outreach/production
          COMPOSE_CONTENT: ${{ steps.compose.outputs.content }}

        run: |
          COMMANDS=$(jq -n \
            --arg compose "$COMPOSE_CONTENT" \
            --arg secretId "$SECRET_ID" \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg imageTag "$IMAGE_TAG" \
            '{
              commands: [
                "set -e",

                "mkdir -p /opt/outreach",

                ("echo '\''" + $compose + "'\'' | base64 -d > /opt/outreach/docker-compose.production.yml"),

                (
                  "aws secretsmanager get-secret-value " +
                  "--secret-id '\''" + $secretId + "'\'' " +
                  "--query SecretString " +
                  "--output text " +
                  "--region '\''" + $region + "'\'' " +
                  "| jq -r '\''to_entries | .[] | \"\\(.key)=\\(.value)\"'\'' " +
                  "> /opt/outreach/.env"
                ),

                ("echo ECR_REGISTRY=" + $registry + " > /opt/outreach/.deploy.env"),

                ("echo IMAGE_TAG=" + $imageTag + " >> /opt/outreach/.deploy.env"),

                (
                  "aws ecr get-login-password --region '\''" +
                  $region +
                  "'\'' | docker login --username AWS --password-stdin '\''" +
                  $registry +
                  "'\''"
                ),

                "echo ========== DISK SPACE BEFORE DEPLOY ==========",

                "df -h",

                "echo ========== DOCKER DISK USAGE ==========",

                "docker system df",

                "echo ========== PULLING IMAGES ==========",

                "docker compose --env-file /opt/outreach/.deploy.env --env-file /opt/outreach/.env -f /opt/outreach/docker-compose.production.yml pull --quiet",

                "echo ========== STARTING CONTAINERS ==========",

                "docker compose --env-file /opt/outreach/.deploy.env --env-file /opt/outreach/.env -f /opt/outreach/docker-compose.production.yml up -d --remove-orphans",

                "echo ========== CONTAINER STATUS ==========",

                "docker ps",

                "echo ========== COMPOSE STATUS ==========",

                "docker compose --env-file /opt/outreach/.deploy.env --env-file /opt/outreach/.env -f /opt/outreach/docker-compose.production.yml ps",

                "echo ========== HTTP SERVER LOGS ==========",

                "docker compose --env-file /opt/outreach/.deploy.env --env-file /opt/outreach/.env -f /opt/outreach/docker-compose.production.yml logs --tail=50 http-server || true",

                "echo ========== WORKER LOGS ==========",

                "docker compose --env-file /opt/outreach/.deploy.env --env-file /opt/outreach/.env -f /opt/outreach/docker-compose.production.yml logs --tail=50 worker || true",

                "echo ========== WEB LOGS ==========",

                "docker compose --env-file /opt/outreach/.deploy.env --env-file /opt/outreach/.env -f /opt/outreach/docker-compose.production.yml logs --tail=50 web || true",

                "echo ========== CLEANING UNUSED IMAGES ==========",

                "docker image prune -f",

                "echo ========== DISK SPACE AFTER DEPLOY ==========",

                "df -h"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Outreach Production $IMAGE_TAG" \
            --parameters "$COMMANDS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          set +e

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          set -e

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" \
            --output text)

          echo "========== DEPLOYMENT STATUS =========="
          echo "$STATUS"

          echo "========== STANDARD OUTPUT =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text

          echo "========== STANDARD ERROR =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardErrorContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed on EC2"
            exit 1
          fi